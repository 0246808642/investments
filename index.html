<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover habilita env(safe-area-inset-*) no iPhone.
         Zoom continua permitido de proposito: o jeito certo de evitar o
         auto-zoom do iOS ao focar um input e usar fonte >= 16px nele. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Inter. display=swap: sem rede na primeira visita o texto sai no stack de
         sistema (metricas proximas) em vez de ficar invisivel.
         O tamanho do download e controlado pelo unicode-range de cada @font-face
         que a folha declara — o browser busca so os arquivos latin e latin-ext
         que a pagina realmente usa, e ignora cirilico, grego e vietnamita. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="apple-touch-icon" href="/icone.svg" />
    <title>Investments</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
